{% extends "base.html" %}
{% block body %}
<h2>Add Event</h2>
<p class="err">{{ error }}</p>
<form method="post">
 <label>Event Code</label><input type="number" name="evCode" required>
 <label>Event Name</label><input name="evName" required>
 <label>Event Date</label><input type="date" name="evDate" required>
 <label>Venue</label><input name="evVenue" required>
 <label>Registration Fee</label><input type="number" step="0.01" name="evRFee" required>
 <p><button>Save</button> <a href="/events">Cancel</a></p>
</form>
{% endblock %}
