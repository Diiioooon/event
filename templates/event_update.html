{% extends "base.html" %}
{% block body %}
<h2>Search - Update an Event</h2>
<form method="get">
 Search (code or name): <input name="q" value="{{ q }}"> <button>Search</button>
</form>
<a href="/">Back to Menu</a>
<table>
<tr><th>Code</th><th>Name</th><th>Date</th><th>Venue</th><th>Reg. Fee</th><th>Action</th></tr>
{% for r in rows %}
<tr><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ r[3] }}</td><td>{{ '%.2f'|format(r[4]) }}</td>
 <td><a href="/events/edit/{{ r[0] }}">Edit</a></td></tr>
{% endfor %}
</table>
{% endblock %}
